# Unit tests + coverage, reported back to the Content Studio.
#
# The studio's scheduler dispatches this daily and then READS this run: its
# conclusion becomes the project's "unit tests" tag, and the MONITOR_COVERAGE
# line below becomes its "coverage %" tag and the shields endpoint the studio
# publishes. Nothing is committed here, no secret is needed, and the README is
# maintained by the studio — do not add badges to it by hand.
name: Coverage

on:
  # Dispatched daily by the studio scheduler (and on demand from
  # Monitoring → Coverage). Without this the number only moves on a push.
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer run supersedes an in-flight one on the same ref — a daily dispatch
# landing on top of a push must not queue behind it.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before setup-node, whose cache step shells out to it.
      # The version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Reporters come from vitest.config.mts (json-summary is the one the
      # studio parses); --reporter=json additionally yields the test counts.
      - name: Run tests with coverage
        run: >-
          pnpm vitest run --coverage
          --reporter=default
          --reporter=json
          --outputFile.json=.vitest.json

      # `always()`: a failing suite still measured something, and the studio
      # shows the red tag NEXT TO a real percentage.
      - name: Report to the studio
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let out = { pct: null };
            try {
              const t = JSON.parse(
                fs.readFileSync("./coverage/coverage-summary.json", "utf8"),
              ).total.lines;
              // covered:0/total:0 means nothing was instrumented — that is
              // "unknown" (null), not a measured 0%.
              if (t.total > 0) {
                out = { pct: t.pct, lines: { covered: t.covered, total: t.total } };
              }
            } catch {}
            try {
              const r = JSON.parse(fs.readFileSync("./.vitest.json", "utf8"));
              out.tests = {
                passed: r.numPassedTests,
                failed: r.numFailedTests,
                skipped: r.numPendingTests,
              };
            } catch {}
            console.log(
              "::notice title=coverage::MONITOR_COVERAGE " + JSON.stringify(out),
            );
          '

      - name: Build
        run: pnpm build
